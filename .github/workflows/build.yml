name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'

    - name: Create Flutter App and Apply Fixes
      run: |
        # 1. ახალი აპლიკაციის შექმნა
        flutter create ping_app --org com.ping.stabilizer
        cd ping_app

        # 2. შენი main.dart-ის ჩასმა
        cp ../main.dart lib/main.dart

        # 3. ბიბლიოთეკების დამატება
        flutter pub add wireguard_flutter device_apps

        # 4. minSdkVersion=21-ის მითითება სტანდარტული გზით
        echo "flutter.minSdkVersion=21" >> android/local.properties

        # 5. VPN უფლებების უსაფრთხო ჩამატება Manifest-ში
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.BIND_VPN_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>' android/app/src/main/AndroidManifest.xml

        # 6. APK-ს აწყობა
        flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ping-stabilizer-apk
        path: ping_app/build/app/outputs/flutter-apk/app-release.apk
        
